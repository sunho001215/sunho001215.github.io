<figure class="figure">
  <video class="media" controls playsinline preload="metadata"{% if include.poster %} poster="{{ include.poster | relative_url }}"{% endif %}>
    <source src="{{ include.src | relative_url }}" type="video/mp4">
    Your browser does not support embedded videos. <a href="{{ include.src | relative_url }}">Download the video</a>.
  </video>
  {%- if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {%- endif %}
</figure>
